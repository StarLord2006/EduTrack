# Create attendance_db in MySQL Workbench first, using the server on port 3307.
spring.datasource.url=jdbc:mysql://localhost:3307/attendance_db?serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Satvikk@2006}

# For learning, let JPA create/update tables from our entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100

# Local learning key only. Set JWT_SECRET to a private Base64-encoded 32-byte key outside development.
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.security.admin.username=${ADMIN_USERNAME:}
app.security.admin.password=${ADMIN_PASSWORD:}
